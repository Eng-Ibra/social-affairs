# Custom vhost for container hosting (Render, Fly.io, etc.). The app's own
# public/.htaccess is what actually implements URL rewriting — this file
# only needs to point DocumentRoot at public/ and allow .htaccess to run,
# since Debian's stock apache2.conf ships with "AllowOverride None".
<VirtualHost *:${PORT}>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
